name: Deploy to allspeak.ai

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y zip rsync

      - name: Build
        run: ./build-allspeak

      - name: Prepare deploy/ directory
        run: |
          # build-allspeak already writes directly to deploy/dist/
          cp server.allspeak edit.html deploy/code/
          # The tools an agent uses are published, not shipped in a pack: a project fetches the one it
          # needs from https://allspeak.ai/code/tools/. Kept in step with ./deploy-allspeak.
          cp asedit.allspeak asedit-graph.allspeak asedit-side.allspeak asedit.json deploy/dist/
          mkdir -p deploy/code/tools
          cp -p tools/plotview-check.js tools/guard-check.js tools/capture-check.js tools/encoding-check.js deploy/code/tools/
# **The Python ones are published as `.py.txt` because the site *executes* `.py`.** Measured 2026-10-04:
# `/code/tools/asdoc-check.py` answered `500 Internal Server Error` (the file is run, not served), while the
# three `.js` files came back as text. The extension is only in the URL: the instructions tell an agent to
# save it as `asdoc-check.py`.
cp -p tools/asdoc-check.py deploy/code/tools/asdoc-check.py.txt
cp -p tools/viz-align-measure.py deploy/code/tools/viz-align-measure.py.txt
          ./build-starters

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          # Protect server-side dist/<YYMMDD>/ snapshot directories from --delete,
          # since they aren't kept in the repo.
          rsync -avz --delete \
            --filter='P /dist/[0-9]*' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            deploy/ \
            allspeak@allspeak.ai:allspeak.ai/

      - name: Snapshot dist/ to dated path
        run: |
          VERSION="$(date +%y%m%d)"
          echo "Snapshotting deploy/dist/ to dist/${VERSION}/"
          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519" \
            deploy/dist/ \
            allspeak@allspeak.ai:allspeak.ai/dist/${VERSION}/

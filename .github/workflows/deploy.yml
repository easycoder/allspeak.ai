name: Deploy to allspeak.ai

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y zip rsync

      - name: Build
        run: ./build-allspeak

      - name: Prepare deploy/ directory
        run: |
          # build-allspeak already writes directly to deploy/dist/
          cp server.allspeak viz.html deploy/code/
          # The page's old name, served beside the new one for a window — see ./deploy-allspeak.
          cp viz.html deploy/code/edit.html
          # The tools an agent uses are published, not shipped in a pack: a project fetches the one it
          # needs from https://allspeak.ai/code/tools/. Kept in step with ./deploy-allspeak.
          cp viz.allspeak viz-graph.allspeak viz-side.allspeak viz.json deploy/dist/
          # The old names, served beside the new ones for a window — see ./deploy-allspeak for why.
          cp viz.allspeak deploy/dist/asedit.allspeak
          cp viz-graph.allspeak deploy/dist/asedit-graph.allspeak
          cp viz-side.allspeak deploy/dist/asedit-side.allspeak
          cp viz.json deploy/dist/asedit.json
          mkdir -p deploy/code/tools
          cp -p tools/plotview-check.js tools/guard-check.js tools/capture-check.js tools/encoding-check.js tools/flush-check.js deploy/code/tools/
# **The Python tools are published with no `py` in the name at all, because the site *executes* one.**
# Measured 2026-10-04: `/code/tools/asdoc-check.py` answered `500` (run, not served) — and so did
# `asdoc-check.py.txt`, because the handler matches `.py` *anywhere* in the name. `.txt` alone is served as
# text (`/robots.txt` proves it). The name lives only in the URL: the instructions tell an agent to save it
# as `asdoc-check.py`.
cp -p tools/asdoc-check.py deploy/code/tools/asdoc-check.txt
cp -p tools/viz-align-measure.py deploy/code/tools/viz-align-measure.txt
          ./build-starters

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          # Two protected paths, and neither is kept in the repo:
          #   `P /dist/[0-9]*`  the server-side dated snapshot directories.
          #   `P /dev`          the preview mirror published by `./deploy-allspeak --dev` from a dev machine.
          # Without the second, this workflow's --delete would remove the mirror on every CI deploy — silently,
          # and with the next preview 404ing for no visible reason. Kept in step with ./deploy-allspeak.
          rsync -avz --delete \
            --filter='P /dist/[0-9]*' \
            --filter='P /dev' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            deploy/ \
            allspeak@allspeak.ai:allspeak.ai/

      - name: Snapshot dist/ to dated path
        run: |
          VERSION="$(date +%y%m%d)"
          echo "Snapshotting deploy/dist/ to dist/${VERSION}/"
          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519" \
            deploy/dist/ \
            allspeak@allspeak.ai:allspeak.ai/dist/${VERSION}/
